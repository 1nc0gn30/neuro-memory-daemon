[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro-memory-daemon"
version = "0.1.0"
description = "Cognitive neuroscience-inspired persistent memory daemon with STDP synaptic plasticity, CA3/CA1 pattern completion, Ebbinghaus forgetting curves, Material 3 Memory Studio UI (design influenced by Material 3), and native Model Context Protocol (MCP) server."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = [
    "neuroscience",
    "memory-daemon",
    "stdp",
    "synaptic-plasticity",
    "hippocampus",
    "ca3-ca1",
    "ebbinghaus-decay",
    "mcp",
    "model-context-protocol",
    "ai-agents",
    "cognitive-architecture",
    "neuromodulation",
    "yerkes-dodson",
    "dopamine-stdp",
    "flashbulb-memory",
    "norepinephrine"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Operating System :: OS Independent"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[project.scripts]
neuro-memory-daemon = "neuro_memory_daemon.cli:main"
neuro-memory = "neuro_memory_daemon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["neuro_memory_daemon*"]

[tool.setuptools.package-data]
neuro_memory_daemon = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]
